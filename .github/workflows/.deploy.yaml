name: Deploy Backend

on:
    push:
        branches:
            - main

concurrency:
    group: deploy-backend
    cancel-in-progress: true

jobs:
    deploy:
        runs-on: ubuntu-latest

        steps:
            - name: Deploy to server via SSH
              uses: appleboy/ssh-action@v1.2.0
              with:
                  host: ${{ secrets.SERVER_HOST }}
                  username: ${{ secrets.SERVER_USER }}
                  key: ${{ secrets.SERVER_SSH_KEY }}
                  port: ${{ secrets.SERVER_PORT }}
                  script_stop: true
                  script: |
                      set -e

                      cd /home/deploy/apps/backend

                      git fetch origin
                      git reset --hard origin/main

                      npm ci --omit=dev

                      if pm2 describe armiadoc-backend > /dev/null 2>&1; then
                        pm2 restart armiadoc-backend
                      else
                        pm2 start npm --name armiadoc-backend -- start
                      fi

                      pm2 save

                      sleep 3
                      curl -f https://armiadoc.chost.com.ua/api/healht/health
